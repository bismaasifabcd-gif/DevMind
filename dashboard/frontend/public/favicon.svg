<?xml version="1.0" encoding="UTF-8"?>
<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="favicon-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e40af" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="16" cy="16" r="15" fill="url(#favicon-bg)" stroke="rgba(255,255,255,0.3)" stroke-width="0.5"/>
  
  <!-- DevMind Logo Pattern -->
  <g transform="translate(16, 16)">
    <!-- Main diamond shape - dark blue parts -->
    <path d="M-8,-6 L0,-10 L8,-6 L5,-3 L0,-5 L-5,-3 Z" fill="#1e40af"/>
    <path d="M-8,-6 L-10,0 L-8,6 L-5,3 L-6,0 L-5,-3 Z" fill="#1e40af"/>
    <path d="M5,-3 L8,-6 L10,0 L8,6 L5,3 L6,0 Z" fill="#06b6d4"/>
    <path d="M-5,3 L0,5 L5,3 L8,6 L0,10 L-8,6 Z" fill="#06b6d4"/>
    
    <!-- Inner pattern -->
    <path d="M-5,-3 L0,-5 L5,-3 L3,-1 L0,-2 L-3,-1 Z" fill="rgba(255,255,255,0.9)"/>
    <path d="M-5,-3 L-3,-1 L-5,3 L-3,2 L-2,0 L-3,-1 Z" fill="rgba(255,255,255,0.9)"/>
    <path d="M3,-1 L5,-3 L5,3 L3,2 L2,0 L3,-1 Z" fill="rgba(255,255,255,0.9)"/>
    <path d="M-3,2 L0,2 L3,2 L5,3 L0,5 L-5,3 Z" fill="rgba(255,255,255,0.9)"/>
    
    <!-- Central connector -->
    <circle cx="0" cy="0" r="2" fill="#ffffff"/>
  </g>
</svg>